# AHoJ-AlphaFold — conda environment (optional alternative to requirements.txt)
# Create with:  conda env create -f environment.yml
# Activate with: conda activate ahoj-alphafold
name: ahoj-alphafold
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - pandas>=1.5
  - numpy>=1.23
  - scipy>=1.9
  - matplotlib>=3.6
  - scikit-learn>=1.1
  - seaborn>=0.12
  - plotly>=5.10
  - python-kaleido>=0.2.1   # static image export for plotly
  - gemmi>=0.6
  - requests>=2.28
  - tqdm>=4.64
  - pillow>=9.2
