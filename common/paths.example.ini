# ---------------------------------------------------------------------------
# AHoJ-AlphaFold — local path configuration TEMPLATE
#
# 1. Copy this file to  common/paths.ini  (paths.ini is git-ignored).
# 2. Fill in the absolute roots for YOUR machine below.
# 3. All scripts read these via common/config.py — you only edit this one file.
#
# Alternatively, set the matching environment variables (these win over the ini):
#   AHOJ_AF_WORK_DIR, AHOJ_DB_DIR, AFDB_STRUCTURES_DIR, P2RANK_PRED_DIR,
#   AHOJ_AF_PRESENTATION_DIR, AHOJ_OUTPUT_FIX_DIR, AHOJ_EXAMPLE_ENTRIES_DIR,
#   AHOJ_AF_MANUSCRIPT_FIGURES_DIR, AHOJ_AF_ENTRY_EXAMPLE_PSE
#
# Windows paths may be written with single backslashes here (no quoting needed),
# e.g.  work_dir = C:\Users\you\OneDrive\AHoJ-AF\work_dir
# ---------------------------------------------------------------------------

[paths]
# Project work_dir — almost every script reads/writes under here (REQUIRED).
work_dir         = /path/to/AHoJ-AF/work_dir

# AHoJ-DB database root (v2c) — apo/holo classification inputs (REQUIRED for
# the UBS-clustering / unified-table build and P2Rank descriptor correlations).
ahoj_db_dir      = /path/to/My_Databases/AHOJ_DB/v2c

# AlphaFold-DB monomer models (*.cif.gz) — needed only to (re)build pocket
# geometry / download models (Analysis 5 dataset build).
afdb_dir         = /path/to/AFDB_structures/v6

# Raw P2Rank prediction outputs (eval dirs / cases) — needed only to (re)build
# the P2Rank per-pocket table (Analysis 5).
p2rank_pred_dir  = /path/to/p2rank_predictions_on_afdb

# Per-UniProt UBS threshold TSVs (UBS_root_2/<UniProt>/ST_*.tsv) — needed only to
# (re)build the ST_100 AFDB dataset (Analysis 5 dataset build).
ubs_root_dir     = /path/to/binding_site_unification/UBS_root_2

# OPTIONAL: where a few plotting scripts also export poster/talk versions.
presentation_dir = /path/to/AHoJ-AF/presentation/plots

# OPTIONAL (Analysis 6 docking): per-job AHoJ run outputs
# (output_fix/<batch>/<job>.tgz, each with pocket_residues.csv = PDB-numbered
# binding residues). Used to attach authoritative PDB pocket residues to escorts.
ahoj_output_fix_dir = /path/to/AHoJ_runs/June_2024/v2c/output_fix

# OPTIONAL (Figure 1b worked example): per-entry outputs of parse-ahoj's
# plot_example_entries.py; the figure reads 093/2yiw-A-I46-1354/statistics/ under here.
example_entries_dir = /path/to/ahoj_example_entries

# OPTIONAL (plotting/manuscript_v4/): where the composed manuscript figures are
# written (parts/ and SI/ go underneath). Unset: <work_dir>/unified_output/run5/plots/manuscript_v4.
# AHOJ_AF_MODEL_SET=afdbv4 writes to the same name with "_afdbv4" appended.
# manuscript_figures_dir = /path/to/AHoJ-AF/manuscript/figures

# OPTIONAL (SI Figure S9d): the PyMOL session of the worked entry 2yiw A I46 1354,
# rendered by plotting/manuscript_v4/render_si_entry_pymol_v4.py.
# entry_example_pse = /path/to/pymol/2yiw-A-I46-1354/extended_ahoj_pocket.pse
